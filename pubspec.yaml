name: agora_market_app
description: "AgoraMarket - High-Performance Vertical Video Job and Service Marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  get_it: ^9.3.0
  dio: ^5.11.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.3.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
